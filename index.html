<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-CRM</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <h1>Мини-CRM</h1>

    <p id="data-warning" class="warning" role="alert" hidden></p>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Новый клиент</h2>
      <form id="client-form" novalidate>
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" autocomplete="off" aria-describedby="name-error">
        <p id="name-error" class="error" aria-live="polite"></p>

        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" autocomplete="off" aria-describedby="phone-error">
        <p id="phone-error" class="error" aria-live="polite"></p>

        <button type="submit">Добавить</button>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title" tabindex="-1">Клиенты</h2>
      <div class="toolbar">
        <div class="toolbar-search">
          <label for="search">Поиск</label>
          <input id="search" type="search" placeholder="Имя или телефон" autocomplete="off">
        </div>
        <div>
          <label for="status-filter">Статус</label>
          <select id="status-filter">
            <option value="all">Все</option>
          </select>
        </div>
        <div>
          <label for="sort">Сортировка</label>
          <select id="sort"></select>
        </div>
      </div>
      <p id="empty-message">Пока нет клиентов.</p>
      <ul id="client-list"></ul>
    </section>
  </main>
</body>
</html>
